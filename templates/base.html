<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="page">
        <section class="header">
            <h1>{{ page_title }}</h1>
            <p>{{ page_subtitle }}</p>

            <div class="stats">
                <span class="stat">{{ stat_label }}：{{ total_count }}</span>
                <span class="stat">AI 已处理：{{ ai_processed_count }}</span>
                <span class="stat">生成时间：{{ generated_at }}</span>
            </div>
        </section>

        <nav class="nav">
            <a class="nav-link {% if active_page == 'index' %}active{% endif %}" href="/">全部信息</a>
            <a class="nav-link {% if active_page == 'featured' %}active{% endif %}" href="/featured">精选信息</a>
            <a class="nav-link {% if active_page == 'daily' %}active{% endif %}" href="/daily">每日简报</a>
        </nav>

        {% block content %}{% endblock %}

        <footer class="footer">
            Generated dynamically by OrbitAI V3.1
        </footer>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
