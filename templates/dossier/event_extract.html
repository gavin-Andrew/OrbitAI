{% extends "dossier/base.html" %}
{% block content %}
<p>选 1–3 篇讲同一件事的 RSS 材料，调用当前配置的 AI 拟一个草稿。结果保留原文依据与疑点，预览保存前不写入事件，也不会自动确认。</p>
<form method="post" action="{{ url_for('event_extract') }}">
<p><label>查找材料 <input type="search" data-material-filter placeholder="输入标题或来源关键词"></label></p>
{% for article in options.articles %}<details data-material-choice data-search="{{ article.title }} {{ article.source }}"><summary><label><input type="checkbox" name="article_ids" value="{{ article.id }}">{{ article.title }}</label> · {{ article.source }}</summary><p>{{ article.summary_original or '没有可用原文，无法提取' }}</p></details>{% endfor %}
<button>拟事件草稿（调用 AI）</button></form><p><a href="{{ url_for('event_new') }}">直接手工整理</a> · <a href="{{ url_for('event_ledger') }}">返回台账</a></p>
<script src="{{ url_for('static', path='dossier/events.js') }}" defer></script>
{% endblock %}
